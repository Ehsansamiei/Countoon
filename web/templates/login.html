
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countoon | Login</title>
  <link rel="icon" type="image/png" href="/media/Icons/countoon_logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-orange: #ff7a00;
      --dark-orange: #e86400;
      --light-orange: #fff4e6;
    }

    body {
      background: linear-gradient(180deg, #fff7ef 0%, #fffaf5 100%);
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(255, 122, 0, 0.2);
      padding: 40px 35px;
      width: 100%;
      max-width: 400px;
      border-top: 4px solid var(--primary-orange);
    }

    .login-title {
      font-weight: 800;
      font-size: 2rem;
      color: var(--dark-orange);
      text-align: center;
      margin-bottom: 35px;
      letter-spacing: -0.5px;
    }

    .form-label {
      font-weight: 500;
      color: #444;
    }

    .form-control {
      border: 1.5px solid #ffd4aa;
      border-radius: 8px;
      padding: 10px 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary-orange);
      box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 10px;
      font-weight: 600;
      border-radius: 8px;
      background-color: var(--primary-orange);
      border: none;
      color: white;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn-login:hover {
      background-color: var(--dark-orange);
      transform: translateY(-2px);
    }

    hr {
      margin: 25px 0;
      border-top: 1px solid #ffe1c2;
    }

    p {
      text-align: center;
      font-size: 0.95rem;
      color: #666;
    }

    a {
      color: var(--primary-orange);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    a:hover {
      color: var(--dark-orange);
      text-decoration: underline;
    }

    .message {
      margin-top: 10px;
      color: #dc3545;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-title">Countoon</div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" class="form-control" placeholder="Enter your username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-login">Log In</button>
      <hr>
      <p>Don't have an account? <a href="/register">Register</a></p>
      {% for message in messages %}
        <div class="message">{{ message }}</div>
      {% endfor %}
    </form>
  </div>
</body>
</html>
