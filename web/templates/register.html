
{% load form_tags %}
{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countoon | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .register-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .register-title {
      font-weight: 700;
      font-size: 2rem;
      color: #007bff;
      text-align: center;
      margin-bottom: 30px;
    }
    .btn-register {
      width: 100%;
      padding: 10px;
      font-weight: 600;
      border-radius: 8px;
    }
    .message {
      margin-top: 5px;
      color: #dc3545;
      font-weight: 500;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-title">Countoon</div>
    <form method="post">
      {% csrf_token %}

      {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field|add_class:"form-control" }}
        {% if field.errors %}
          <div class="message">{{ field.errors|striptags }}</div>
        {% endif %}
      </div>
      {% endfor %}

      <button type="submit" class="btn btn-primary btn-register">Register</button>

      {% for message in messages %}
        <div class="message">{{ message }}</div>
      {% endfor %}
    </form>
  </div>

  <!-- Optional: add bootstrap js for nicer components -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
